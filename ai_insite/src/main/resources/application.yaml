spring:
  application:
    name: ai_insite
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_insite?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  mvc:
    async:
      request-timeout: ${MODEL_DATASET_EXPORT_TIMEOUT:600000}

external:
  seoul:
    enabled: ${SEOUL_API_ENABLED:false}
    scheduler-enabled: ${SEOUL_SCHEDULER_ENABLED:false}
    base-url: ${SEOUL_API_BASE_URL:http://openapi.seoul.go.kr:8088}
    api-key: ${SEOUL_API_KEY:}
    schedule-cron: ${SEOUL_SCHEDULE_CRON:0 0 3 * * *}
    target-period: ${SEOUL_TARGET_PERIOD:}
    page-size: ${SEOUL_API_PAGE_SIZE:1000}
    max-pages: ${SEOUL_API_MAX_PAGES:100}
  public-data:
    enabled: ${PUBLIC_DATA_API_ENABLED:false}
    base-url: ${PUBLIC_DATA_API_BASE_URL:https://apis.data.go.kr}
    service-key: ${PUBLIC_DATA_API_KEY:}
    commercial-transaction:
      path: ${COMMERCIAL_TRANSACTION_API_PATH:/1613000/RTMSDataSvcNrgTrade/getRTMSDataSvcNrgTrade}
      page-size: ${COMMERCIAL_TRANSACTION_API_PAGE_SIZE:1000}
    building-register:
      path: ${BUILDING_REGISTER_API_PATH:/1613000/BldRgstHubService/getBrTitleInfo}
      page-size: ${BUILDING_REGISTER_API_PAGE_SIZE:1000}
      max-pages-per-legal-dong: ${BUILDING_REGISTER_API_MAX_PAGES_PER_LEGAL_DONG:100}
    small-business:
      path: ${SMALL_BUSINESS_API_PATH:/B553077/api/open/sdsc2/storeListInDong}
      page-size: ${SMALL_BUSINESS_API_PAGE_SIZE:1000}
      max-pages-per-district: ${SMALL_BUSINESS_API_MAX_PAGES:100}
  reb:
    enabled: ${REB_API_ENABLED:false}
    base-url: ${REB_API_BASE_URL:https://www.reb.or.kr}
    api-key: ${REB_API_KEY:}
    statistics-path: ${REB_STATISTICS_API_PATH:/r-one/openapi/SttsApiTblData.do}
    page-size: ${REB_API_PAGE_SIZE:1000}
  kakao:
    enabled: ${KAKAO_API_ENABLED:false}
    base-url: ${KAKAO_API_BASE_URL:https://dapi.kakao.com}
    api-key: ${KAKAO_REST_API_KEY:}

prediction:
  model:
    enabled: ${PREDICTION_MODEL_ENABLED:false}
    base-url: ${PREDICTION_MODEL_BASE_URL:http://127.0.0.1:8000}
    release-version: ${PREDICTION_MODEL_RELEASE:}
    connect-timeout: ${PREDICTION_MODEL_CONNECT_TIMEOUT:2s}
    read-timeout: ${PREDICTION_MODEL_READ_TIMEOUT:5s}
