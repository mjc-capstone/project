[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insite-model"
version = "0.1.0"
description = "AI Insite commercial district model training and inference server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "lightgbm==4.7.0",
    "numpy==2.3.2",
    "pydantic==2.13.4",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
training = [
    "scikit-learn==1.9.0",
]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
